<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fléchettes</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ===================== ACCUEIL ===================== -->
  <div id="screen-home" class="screen active">
    <div class="home-title"><span class="brand">🎯 FLÉCHETTES</span></div>

    <!-- Reprise (visible si partie en cours) -->
    <div id="resume-card" class="card resume-card" style="display:none">
      <div class="resume-title">PARTIE EN COURS</div>
      <div id="resume-info" class="resume-info"></div>
      <button class="btn-primary big" onclick="resumeGame()">↩ REPRENDRE LA PARTIE</button>
    </div>

    <div class="card">
      <div class="eyebrow">Joueurs de la partie</div>
      <div id="players-list"></div>
      <div class="eyebrow" style="margin-top:4px">Joueurs enregistrés</div>
      <div id="saved-players-list"></div>
      <div class="row" style="margin-top:4px">
        <input id="player-input" type="text" placeholder="Nouveau joueur…" />
        <button class="btn-ghost" onclick="createPlayer()">Créer</button>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Mode de jeu</div>
      <div class="mode-grid" id="mode-select">
        <button class="mode-btn active" data-mode="501">501</button>
        <button class="mode-btn" data-mode="301">301</button>
        <button class="mode-btn" data-mode="701">701</button>
        <button class="mode-btn" data-mode="cricket">Cricket</button>
        <button class="mode-btn" data-mode="clock">Horloge</button>
      </div>
      <div class="opts" id="x01-options">
        <label><input type="checkbox" id="double-in" /> Double In</label>
        <label><input type="checkbox" id="double-out" /> Double Out</label>
      </div>
      <div class="opts" id="cricket-options" style="display:none">
        <label><input type="checkbox" id="cut-throat" /> Cut-throat (le perdant prend les points)</label>
      </div>
    </div>

    <button class="btn-primary big" onclick="startGame()">LANCER LA PARTIE</button>

    <!-- Classement Elo — toutes les parties comptent, pour tout le monde -->
    <div class="card" id="home-elo-card" style="margin-top:22px">
      <div class="eyebrow">Classement Elo</div>
      <div id="home-elo"></div>
    </div>

    <button class="btn-ghost big" style="margin-top:8px" onclick="showTournament()">🏆 TOURNOI GRASSIENS</button>
    <button class="btn-ghost big" style="margin-top:8px" onclick="showHistory()">Anciennes parties & stats</button>
    <button id="exit-kiosk-btn" class="btn-ghost big" style="display:none;margin-top:8px" onclick="exitKiosk()">✕ Quitter l'application</button>
  </div>

  <!-- ===================== JEU ===================== -->
  <div id="screen-game" class="screen">
    <header class="game-header">
      <button class="btn-ghost" onclick="showHome()">← Accueil</button>
      <div class="game-title">
        <span id="game-context" class="game-context"></span>
        <span id="game-mode-label"></span>
      </div>
      <div class="sensor"><span class="dot"></span>CAPTEUR</div>
    </header>

    <div id="scoreboard"></div>
    <div id="game-main" class="game-main"></div>

    <!-- Saisie manuelle -->
    <div class="manual-panel" id="manual-panel">
      <div class="manual-head">
        <span class="eyebrow">Saisie manuelle</span>
        <div class="mult-row">
          <button class="mult-btn active" data-mult="1">Simple</button>
          <button class="mult-btn" data-mult="2">Double</button>
          <button class="mult-btn" data-mult="3">Triple</button>
        </div>
      </div>
      <div class="sectors-grid" id="sectors-grid"></div>
      <div class="action-row">
        <button class="undo" onclick="undoDart()">↺ ANNULER LE DERNIER TIR</button>
        <button class="validate" onclick="endTurn()">VALIDER</button>
      </div>
    </div>

    <!-- Cible de précision — impacts caméra du joueur en cours -->
    <div class="card impact-card" id="impact-card">
      <span class="eyebrow">Précision — <span id="impact-name"></span></span>
      <div id="impact-board" class="impact-board"></div>
    </div>

    <!-- Correction de score (x01) -->
    <details class="card edit-card" id="edit-score-card">
      <summary>Corriger les scores</summary>
      <div id="edit-score-list"></div>
    </details>

    <!-- Bascule affichage TV / interface complète (écran du Pi uniquement) -->
    <button id="tv-toggle" class="tv-toggle" style="display:none"
            title="Afficher ou masquer la saisie" onclick="toggleTv()">⚙</button>
  </div>

  <!-- ===================== VICTOIRE ===================== -->
  <div id="screen-win" class="screen">
    <div class="trophy">🏆</div>
    <h2 id="winner-name"></h2>
    <div class="subtitle">a gagné la partie</div>
    <button class="btn-primary big" onclick="showHome()">NOUVELLE PARTIE</button>
    <button class="btn-ghost big" style="margin-top:8px;max-width:380px;margin-left:auto;margin-right:auto" onclick="showHistory()">Voir les stats</button>
    <button class="btn-danger big" style="margin-top:8px;max-width:380px;margin-left:auto;margin-right:auto" onclick="undoFromWin()">↺ Annuler le dernier tir</button>
  </div>

  <!-- ===================== HISTORIQUE ===================== -->
  <div id="screen-history" class="screen">
    <header class="game-header">
      <button class="btn-ghost" onclick="showHome()">← Accueil</button>
      <div class="game-title">Historique & Stats</div>
      <span style="width:80px"></span>
    </header>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-games" onclick="switchTab('tab-games')">Parties</button>
      <button class="tab-btn" data-tab="tab-stats" onclick="switchTab('tab-stats')">Stats joueurs</button>
    </div>
    <div id="tab-games" class="tab-content active"><div id="games-list"></div></div>
    <div id="tab-stats" class="tab-content"><div id="stats-list"></div></div>
  </div>

  <!-- ===================== TOURNOI ===================== -->
  <div id="screen-tournament" class="screen">
    <header class="game-header">
      <button class="btn-ghost" onclick="showHome()">← Accueil</button>
      <div class="game-title">🏆 TOURNOI GRASSIENS</div>
      <span style="width:80px"></span>
    </header>

    <!-- Création (aucun tournoi en cours) -->
    <div id="tournament-create" style="display:none">
      <div class="card">
        <div class="eyebrow">Inscrits — <span id="tp-count">0</span></div>
        <div id="tp-list"></div>
        <div class="row" style="margin-top:6px">
          <input id="tp-input" type="text" placeholder="Ajouter un joueur…" />
          <button class="btn-ghost" onclick="createTournamentPlayer()">Créer</button>
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">Mode des matchs</div>
        <div class="mode-grid" id="tp-mode">
          <button class="mode-btn active" data-mode="501">501</button>
          <button class="mode-btn" data-mode="301">301</button>
          <button class="mode-btn" data-mode="701">701</button>
          <button class="mode-btn" data-mode="cricket">Cricket</button>
        </div>
        <div class="opts" id="tp-x01-options">
          <label><input type="checkbox" id="tp-double-in" /> Double In</label>
          <label><input type="checkbox" id="tp-double-out" /> Double Out</label>
        </div>
        <div class="opts" id="tp-cricket-options" style="display:none">
          <label><input type="checkbox" id="tp-cut-throat" /> Cut-throat (le perdant prend les points)</label>
        </div>
      </div>

      <div class="card">
        <div class="eyebrow">Format — poules puis tableau final</div>
        <div id="tp-structures"></div>
      </div>

      <button class="btn-primary big" onclick="createTournament()">CRÉER LE TOURNOI</button>
    </div>

    <!-- Tournoi en cours -->
    <div id="tournament-view" style="display:none">
      <div id="tournament-champion"></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-matches" onclick="switchTab('tab-matches')">Matchs</button>
        <button class="tab-btn" data-tab="tab-ranking" onclick="switchTab('tab-ranking')">Classement</button>
      </div>
      <div id="tab-matches" class="tab-content active"><div id="matches-list"></div></div>
      <div id="tab-ranking" class="tab-content"><div id="ranking-list"></div></div>
      <button class="btn-danger big" style="margin-top:14px" onclick="deleteTournament()">Supprimer le tournoi</button>
    </div>
  </div>

  <!-- Clavier virtuel tactile -->
  <div id="vkb" class="vkb" style="display:none">
    <div class="vkb-close" onclick="hideVkb()">✕</div>
  </div>

  <!-- Overlay d'animations (GIF sur scores spéciaux) -->
  <div id="anim-overlay" class="anim-overlay" onclick="dismissAnimation()"></div>

  <script src="/static/js/checkout.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
